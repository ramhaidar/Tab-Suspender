name: CI
on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Debug test environment
        run: |
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
          echo "Test files found:"
          find test -name "*.test.*" | sort
          echo "Jest config:"
          cat jest.config.cjs

      - name: Prepare Jest cache
        run: pnpm run testCacheCreate
        continue-on-error: true

      - name: Run tests with verbose output
        run: pnpm test

      - run: pnpm run build

  puppeteer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            test/puppeteer/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - name: Cache Puppeteer browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('test/puppeteer/pnpm-lock.yaml') }}

      - name: Install Puppeteer test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: test/puppeteer

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run suspend-discard integration test
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac &
          sleep 1
          DISPLAY=:99 pnpm exec tsx suspend-discard.test.ts
        working-directory: test/puppeteer

      - name: Run corrupt-storage regression test
        run: DISPLAY=:99 pnpm exec tsx corrupt-storage.test.ts
        working-directory: test/puppeteer

      - name: Run basic suspend/restore test
        run: DISPLAY=:99 pnpm exec tsx basic-suspend-restore.test.ts
        working-directory: test/puppeteer

      - name: Run auto-restore tab test
        run: DISPLAY=:99 pnpm exec tsx auto-restore-tab.test.ts
        working-directory: test/puppeteer

      - name: Run restore modes test
        run: DISPLAY=:99 pnpm exec tsx restore-modes.test.ts
        working-directory: test/puppeteer

      - name: Run form data restore test
        run: DISPLAY=:99 pnpm exec tsx form-data-restore.test.ts
        working-directory: test/puppeteer

      - name: Run protected URLs test
        run: DISPLAY=:99 pnpm exec tsx protected-urls.test.ts
        working-directory: test/puppeteer

      - name: Run whitelist/ignore test
        run: DISPLAY=:99 pnpm exec tsx whitelist-ignore.test.ts
        working-directory: test/puppeteer

      - name: Run favicon loss test
        run: DISPLAY=:99 pnpm exec tsx favicon-loss.test.ts
        working-directory: test/puppeteer

      - name: Run favicon navigation stress test
        run: DISPLAY=:99 pnpm exec tsx favicon-nav-stress.test.ts
        working-directory: test/puppeteer

      - name: Run screenshot settings test
        run: DISPLAY=:99 pnpm exec tsx screenshot-settings.test.ts
        working-directory: test/puppeteer

      - name: Run discard tab ID change test
        run: DISPLAY=:99 pnpm exec tsx discard-tab-id-change.test.ts
        working-directory: test/puppeteer

      - name: Run unfocused tab discard test
        run: DISPLAY=:99 pnpm exec tsx unfocused-tab-discard.test.ts
        working-directory: test/puppeteer

      - name: Run start discarded test
        run: DISPLAY=:99 pnpm exec tsx start-discarded.test.ts
        working-directory: test/puppeteer

      - name: Run bulk tab operations test
        run: DISPLAY=:99 pnpm exec tsx bulk-tab-operations.test.ts
        working-directory: test/puppeteer

      - name: Run adaptive timeout test
        run: DISPLAY=:99 pnpm exec tsx adaptive-timeout.test.ts
        working-directory: test/puppeteer

      - name: Run pinned tab protection test
        run: DISPLAY=:99 pnpm exec tsx pinned-tab-protection.test.ts
        working-directory: test/puppeteer